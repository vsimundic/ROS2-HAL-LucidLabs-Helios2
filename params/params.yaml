helios2_hal:
  ros__parameters:
    output_topic: "/point_cloud"
    structured_cloud: true
    publish_intensity: true
    publish_depth: true
    confidence_filter:
      enable: true
      threshold: 1000
    spatial_filter:
      enable: true
    flying_filter:
      enable: true
      threshold: 20
    # Options dumped with arv-tool
    # Enumeration: 'Scan3dHDRMode'
    #   EnumEntry: (3) 'Off'
    hdr_mode: 3
    accumulate_frames: 1
    frame_id: "camera"

    # Enumeration: 'ExposureTimeSelector'
    #   EnumEntry: (3) 'Exp350Us'
    #   EnumEntry: (4) 'Exp88Us'
    #   EnumEntry: (5) 'Exp13Us'
    exposure_level: 3

    # Enumeration: 'Scan3dOperatingMode'
    #   EnumEntry: (3) 'Distance8300mmMultiFreq'
    #   EnumEntry: (4) 'Distance6000mmSingleFreq'
    #   EnumEntry: (5) 'Distance5000mmMultiFreq'
    #   EnumEntry: (6) 'Distance4000mmSingleFreq'
    #   EnumEntry: (7) 'Distance3000mmSingleFreq'
    #   EnumEntry: (8) 'Distance1250mmSingleFreq'
    mode: 3

    # Triton RGB colorization. Launch arguments can override enable and serial.
    rgb.enable: true
    rgb.serial: ""
    rgb.orientation_file: "/home/user/helios2-ros2/data/calibration/orientation.yml"
    rgb.intrinsics_file: "/home/user/helios2-ros2/data/calibration/tritoncalibration.yml"
    rgb.frame_id: "triton_optical_frame"
    rgb.max_age_ms: 500.0
    # Resize after capture while retaining the calibrated full field of view.
    # Set both to 0 to publish at the calibrated native resolution.
    rgb.output_width: 640
    rgb.output_height: 480
